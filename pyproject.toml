[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "telegram-digital-shop-core"
version = "0.1.0"
description = "Configurable secure Telegram digital commerce core"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.22.0", "alembic==1.16.5", "asyncpg==0.30.0",
  "cryptography==45.0.7", "fastapi==0.116.1", "httpx==0.28.1",
  "pydantic-settings==2.10.1", "redis==6.4.0", "sqlalchemy[asyncio]==2.0.43",
  "structlog==25.4.0", "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = ["aiosqlite==0.21.0", "pytest==8.4.2", "pytest-asyncio==1.1.0", "pytest-cov==6.2.1", "ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/shopbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "src/shopbot/enhanced.py",
  "src/shopbot/variant_router.py",
  "src/shopbot/variant_store.py",
  "tests/test_variant_store.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.coverage.run]
source = ["shopbot"]
omit = [
  "src/shopbot/main.py",
  "src/shopbot/db.py",
  "src/shopbot/variant_router.py",
  "src/shopbot/enhanced.py",
]
