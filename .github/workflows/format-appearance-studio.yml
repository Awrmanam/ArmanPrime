name: Format Appearance Studio

on:
  push:
    branches:
      - codex/implement-telegram-digital-product-store-bot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-telegram-digital-product-store-bot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.11
      - name: Format appearance studio
        run: |
          ruff format src/shopbot/appearance_studio.py
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shopbot/appearance_studio.py
          git commit -m 'style: format appearance studio'
          git push origin HEAD:codex/implement-telegram-digital-product-store-bot
