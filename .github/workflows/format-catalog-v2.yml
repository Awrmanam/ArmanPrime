name: Format Catalog V2

on:
  push:
    branches:
      - codex/implement-telegram-digital-product-store-bot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-telegram-digital-product-store-bot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.11
      - name: Format catalog files
        run: |
          ruff check --fix src/shopbot/admin_catalog_v2.py src/shopbot/admin_catalog_v2_ext.py tests/test_admin_catalog_v2.py
          ruff format src/shopbot/admin_catalog_v2.py src/shopbot/admin_catalog_v2_ext.py tests/test_admin_catalog_v2.py
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shopbot/admin_catalog_v2.py src/shopbot/admin_catalog_v2_ext.py tests/test_admin_catalog_v2.py
          git commit -m 'style: format catalog admin v2'
          git push origin HEAD:codex/implement-telegram-digital-product-store-bot
