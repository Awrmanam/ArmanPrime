name: Ruff Format Diff

on:
  pull_request:
    branches: [main]

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.12.11
      - run: ruff format --diff src/shopbot/admin_menu.py
